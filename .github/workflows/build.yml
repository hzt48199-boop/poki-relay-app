name: Build PokiRelay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project PokiRelay.xcodeproj \
            -scheme PokiRelay \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/PokiRelay.app"
          ls -la "$APP_PATH"
          rm -rf Payload PokiRelay.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r PokiRelay.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokiRelay-ipa
          path: PokiRelay.ipa
