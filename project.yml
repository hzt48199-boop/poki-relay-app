name: PokiRelay
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  PokiRelay:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naiwa.pokirelay
        PRODUCT_NAME: PokiRelay
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: PokiRelay
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        NSLocalNetworkUsageDescription: "Advertises the pairing host on your local network and relays the pairing connection."
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
